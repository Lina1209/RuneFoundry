<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RuneFoundry — Лаборатория рунических шрифтов</title>
<style>
:root{--bg:#111218;--panel:#1b1d27;--panel2:#242735;--ink:#f2eee7;--muted:#a9a6b2;--accent:#c7a6ff;--line:#383b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui, sans-serif}
header{padding:22px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:#151620}
h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:.03em}header p{margin:5px 0 0;color:var(--muted)}
main{max-width:1200px;margin:auto;padding:24px clamp(14px,3vw,32px) 48px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
button,.filelabel{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit}
button.primary{background:var(--accent);color:#171321;border-color:var(--accent);font-weight:700}
button:hover,.filelabel:hover{filter:brightness(1.12)}
.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{font-size:18px;margin:0 0 12px}
.canvas-wrap{background:#f5f1e9;border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
label{color:var(--muted);font-size:14px}
input,select,textarea{background:#10121a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;min-width:0}
input[type=text]{width:100%}input[type=number]{width:88px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.glyph{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;background:#151722;cursor:pointer}
.glyph.active{outline:2px solid var(--accent);background:#292337}
.glyph strong{font-size:22px}.glyph small{font-size:11px;color:var(--muted)}
.preview{min-height:100px;padding:15px;background:#10121a;border:1px solid var(--line);border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:25px}
.status{color:var(--muted);font-size:13px;margin-top:10px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header><h1>RuneFoundry</h1><p>Творческая лаборатория рунических шрифтов · первая рабочая версия</p></header>
<main>
  <div class="toolbar">
    <button class="primary" id="saveBtn">Сохранить проект JSON</button>
    <label class="filelabel">Загрузить проект JSON <input id="loadFile" type="file" accept=".json,application/json" hidden></label>
    <button id="exportBtn">Экспорт рисунка SVG</button>
    <button id="clearBtn">Очистить знак</button>
  </div>
  <div class="layout">
    <section class="card">
      <h2>Мастерская знака</h2>
      <div class="row">
        <label for="glyphName">Знак / буква</label>
        <input id="glyphName" type="text" value="A" maxlength="8" style="width:100px">
        <label for="strokeWidth">Толщина</label>
        <input id="strokeWidth" type="number" min="1" max="24" value="5">
      </div>
      <div class="canvas-wrap"><canvas id="pad" width="600" height="600" aria-label="Поле рисования руны"></canvas></div>
      <p class="hint">Рисуй пальцем или мышью. Выбери букву справа, чтобы создать отдельный знак для неё.</p>
    </section>
    <section class="card">
      <h2>Таблица символов</h2>
      <div class="row">
        <label for="alphabet">Алфавит</label>
        <select id="alphabet"><option value="latin">Латиница A–Z</option><option value="cyrillic">Кириллица А–Я</option><option value="digits">Цифры 0–9</option></select>
      </div>
      <div class="grid" id="glyphGrid"></div>
      <h2 style="margin-top:20px">Предпросмотр текста</h2>
      <textarea id="sampleText" rows="3" style="width:100%" placeholder="Напиши текст для проверки...">RuneFoundry</textarea>
      <div class="preview" id="preview">RuneFoundry</div>
      <div class="status" id="status">Проект хранится в этом браузере до экспорта JSON.</div>
    </section>
  </div>
</main>
<script>
const pad=document.getElementById('pad'),ctx=pad.getContext('2d');
const state={glyphs:{},active:'A'};
let drawing=false, paths=[], current=[];
function background(){ctx.fillStyle='#f5f1e9';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#d9d2c6';ctx.lineWidth=1;ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(300,25);ctx.lineTo(300,575);ctx.moveTo(25,300);ctx.lineTo(575,300);ctx.stroke();ctx.setLineDash([])}
function redraw(){background();const all=[...(state.glyphs[state.active]||[]),...(current.length?[current]:[])];ctx.strokeStyle='#24202a';ctx.lineWidth=Number(document.getElementById('strokeWidth').value)||5;ctx.lineCap='round';ctx.lineJoin='round';all.forEach(path=>{if(path.length<2)return;ctx.beginPath();ctx.moveTo(path[0][0],path[0][1]);path.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.stroke()})}
function pos(e){const r=pad.getBoundingClientRect();return [(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]}
pad.addEventListener('pointerdown',e=>{drawing=true;current=[pos(e)];pad.setPointerCapture(e.pointerId);redraw()});
pad.addEventListener('pointermove',e=>{if(!drawing)return;current.push(pos(e));redraw()});
function finish(){if(!drawing)return;drawing=false;if(current.length>1){state.glyphs[state.active]??=[];state.glyphs[state.active].push(current)}current=[];redraw();renderGrid();updatePreview()}
pad.addEventListener('pointerup',finish);pad.addEventListener('pointercancel',finish);
const alphabets={latin:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),cyrillic:'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'.split(''),digits:'0123456789'.split('')};
function renderGrid(){const grid=document.getElementById('glyphGrid');grid.innerHTML='';alphabets[document.getElementById('alphabet').value].forEach(ch=>{const b=document.createElement('button');b.className='glyph'+(ch===state.active?' active':'');const count=(state.glyphs[ch]||[]).length;b.innerHTML='<strong>'+ch+'</strong><small>'+count+' штрих.</small>';b.onclick=()=>selectGlyph(ch);grid.appendChild(b)})}
function selectGlyph(ch){state.active=ch;document.getElementById('glyphName').value=ch;redraw();renderGrid()}
document.getElementById('glyphName').addEventListener('change',e=>selectGlyph(e.target.value.trim()||'A'));
document.getElementById('alphabet').addEventListener('change',()=>{const first=alphabets[document.getElementById('alphabet').value][0];selectGlyph(first)});
document.getElementById('strokeWidth').addEventListener('input',redraw);
document.getElementById('clearBtn').onclick=()=>{state.glyphs[state.active]=[];redraw();renderGrid();updatePreview()};
function updatePreview(){const s=document.getElementById('sampleText').value;document.getElementById('preview').textContent=s;document.getElementById('status').textContent='Создано знаков: '+Object.keys(state.glyphs).filter(k=>state.glyphs[k]?.length).length}
document.getElementById('sampleText').addEventListener('input',updatePreview);
document.getElementById('saveBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'RuneFoundry',version:1,glyphs:state.glyphs},null,2)],{type:'application/json'});download(blob,'runefoundry-project.json')};
document.getElementById('loadFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());state.glyphs=data.glyphs||{};selectGlyph(Object.keys(state.glyphs)[0]||'A');updatePreview()}catch{alert('Не удалось прочитать JSON-файл проекта.')}e.target.value=''};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
document.getElementById('exportBtn').onclick=()=>{const pathsForGlyph=state.glyphs[state.active]||[];let body='';pathsForGlyph.forEach(path=>{if(path.length<2)return;body+='<path d="M '+path.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')+'" fill="none" stroke="#24202a" stroke-width="'+(Number(document.getElementById('strokeWidth').value)||5)+'" stroke-linecap="round" stroke-linejoin="round"/>'});const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" fill="#f5f1e9"/>'+body+'</svg>';download(new Blob([svg],{type:'image/svg+xml'}),'rune-'+state.active+'.svg')};
renderGrid();redraw();updatePreview();
</script>
</body>
</html>
